name: Native build and lifecycle

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unix:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15-intel, macos-15]
        configuration: [Release]
        include:
          - runner: ubuntu-24.04
            asset: freelumina-linux-x86_64.so
            lib: build/freelumina.so
          - runner: ubuntu-24.04-arm
            asset: freelumina-linux-aarch64.so
            lib: build/freelumina.so
          - runner: macos-15-intel
            asset: freelumina-macos-x86_64.dylib
            lib: build/freelumina.dylib
          - runner: macos-15
            asset: freelumina-macos-aarch64.dylib
            lib: build/freelumina.dylib
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux compiler
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y gfortran cmake ninja-build
      - name: Install macOS compiler
        if: runner.os == 'macOS'
        run: brew install gcc cmake ninja
      - name: Configure
        env:
          FC: gfortran
        run: >-
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.configuration }}
          -DFL_RUNTIME_CHECKS=OFF
      - name: Build
        run: |
          set -o pipefail
          cmake --build build 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -aiE 'error|fatal' build.log | head -10 | cut -c1-250 | while IFS= read -r line; do
              echo "::error::${line}"
            done
          fi
          exit "$status"
      - run: ctest --test-dir build --output-on-failure
      - name: Stage artifact
        run: cp "${{ matrix.lib }}" "${{ matrix.asset }}"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  windows:
    strategy:
      fail-fast: false
      matrix:
        configuration: [Release]
        target: [x64]
        include:
          - target: x64
            runner: windows-2025
            environment: UCRT64
            package_prefix: mingw-w64-ucrt-x86_64
            compiler_package: gcc-fortran
            c_compiler: gcc
            fortran_compiler: gfortran
            asset: freelumina-windows-x86_64.dll
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7
      - uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.environment }}
          update: true
          install: >-
            ${{ matrix.package_prefix }}-${{ matrix.compiler_package }}
            ${{ matrix.package_prefix }}-cmake
            ${{ matrix.package_prefix }}-ninja
            ${{ matrix.package_prefix }}-python
      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.configuration }}
          -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
          -DCMAKE_Fortran_COMPILER=${{ matrix.fortran_compiler }}
          -DFL_RUNTIME_CHECKS=OFF
      - name: Build
        run: |
          set -o pipefail
          cmake --build build 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -aiE 'error|fatal' build.log | head -10 | cut -c1-250 | while IFS= read -r line; do
              echo "::error::${line}"
            done
          fi
          exit "$status"
      - run: ctest --test-dir build --output-on-failure
      - name: Stage artifact
        run: cp build/freelumina.dll "${{ matrix.asset }}"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  release:
    # The tag is the review. The release is the record. Assets assume the
    # single Release configuration; a second configuration would collide.
    if: startsWith(github.ref, 'refs/tags/')
    needs: [unix, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: freelumina-*
          merge-multiple: true
          path: dist
      - name: Package plugins
        run: |
          for file in dist/freelumina-*; do
            stem="$(basename "${file%.*}")"
            platform="${stem#freelumina-}"
            platform="${platform%%-*}"
            arch="${stem##*-}"
            bash tools/package_plugin.sh \
              --platform "${platform}" --arch "${arch}" \
              --version "${GITHUB_REF_NAME}" \
              --plugin "${file}" --output-dir dist
          done
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.tar.gz
          generate_release_notes: true
